<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Randomizer</title>
  <style>
    body {
      font-family: Chalkboard SE, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #EFD4BB;
    }
    .container {
      background: #FFF;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      text-align: center;
      border: 1px solid #F89999;
      /* Grid background */
      background-image:
      repeating-linear-gradient(#E3EAD9 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, #E3EAD9 0 1px, transparent 1px 20px);
      background-size: 20px 20px;
    }
    #result {
      border: 1px solid #8BA861;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      background: #BDD69A;
      color: #FFF5D4;
      /* Drop shadow: 2pt offset (~2px), 5pt blur (~5px), 75% opacity, 270° (down), hex color #FE6347 */
      text-shadow: 0px 1px 2px rgba(254, 99, 71, 0.75);
    }
    button {
      font-family: Chalkboard SE, sans-serif;
      padding: 12px 24px;
      border: 1px solid #FE6347;
      border-radius: 10px;
      background: #F89999;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #F86267;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="result">Click the button to randomize!</div>
    <button onclick="randomize()">Randomize</button>
  </div>

  <script>
    const items = [
      "The ‘This is Fine’ Dog",
      "Side eye monkey",
      "Evil Kermit",
      "‘I’m just a baby!’",
      "Woman yelling at a cat",
      "Spongebob Squarepants",
      "Minions",
      "The Grinch",
      "Moana",
      "Hunger Games",
      "High School Musical",
      "Kdramas",
      "Dora the Explorer",
      "Trip over nothing",
      "Accidentally waving at someone who wasn’t waving at you",
      "Mime stuck in a box",
      "That one teacher that sticks their butt in your face when they bend over",
      "Influencer in the wild",
      "Walk into a glass door",
      "Sent a text to the wrong person",
      "The wifi crashed",
      "Stepped on a lego",
      "Grumpy Cat",
      "Distracted Boyfriend",
      "Doge",
      "Kermit sipping tea",
      "Laughing Leo",
      "Arthur fist",
      "Success Kid",
      "Baby Yoda / Grogu",
      "Pikachu surprised face",
      "Mario jumping",
      "Luigi panicking",
      "Olaf singing",
      "Dropped ice cream on the floor",
      "Walking into a pole",
      "Tripping on your own shoelace",
      "Phone falling in the toilet",
      "Sneezing on someone",
      "Forgetting your wallet at the store",
      "Dog stealing your food",
      "Getting a song stuck in your head",
      "Screaming at a spider",
      "Dramatically fainting",
      "Overjoyed at finding money on the ground",
      "Shocked by a text from an ex",
      "Crying over a sad commercial",
      "Laughing uncontrollably in a serious situation",
      "Trying to catch a flying bug",
      "Pretending to be invisible",
      "Acting like a mannequin",
      "Slow-motion running",
      "Singing in the shower",
      "Juggling invisible balls",
      "Juggling flaming torches",
      "Mermaid brushing hair",
      "Wizard sneezing magic",
      "Giant eating a tiny car",
      "A flying pig",
      "Robot dancing",
      "Fairy riding a leaf",
      "Vampire in the sun",
      "Riding a dragon",
      "Casting a spell"
    ];

    function randomize() {
      const randomPick = items[Math.floor(Math.random() * items.length)];
      document.getElementById("result").textContent = randomPick;
    }
  </script>
</body>
</html>
